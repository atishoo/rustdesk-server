version: '3'

networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    image: ${RUSTDESK_SERVER_IMAGE:-ghcr.io/atishoo/rustdesk-server:ultrapro}
    command: hbbs -r ${RUSTDESK_RELAY:-hbbr:21117}
    environment:
      ENABLE_TCP_REGISTER: ${ENABLE_TCP_REGISTER:-Y}
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 21117:21117
      - 21119:21119
    image: ${RUSTDESK_SERVER_IMAGE:-ghcr.io/atishoo/rustdesk-server:ultrapro}
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    restart: unless-stopped
