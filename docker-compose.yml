version: '3'

networks:
  capylink-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    image: ${CAPYLINK_SERVER_IMAGE:-ghcr.io/atishoo/capylink-server:ultrapro}
    command: hbbs -r ${CAPYLINK_RELAY:-hbbr:21117}
    environment:
      ENABLE_TCP_REGISTER: ${ENABLE_TCP_REGISTER:-Y}
      MUST_LOGIN: ${MUST_LOGIN:-N}
      CAPYLINK_API_JWT_KEY: ${CAPYLINK_API_JWT_KEY:-}
    volumes:
      - ./data:/root
    networks:
      - capylink-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 21117:21117
      - 21119:21119
    image: ${CAPYLINK_SERVER_IMAGE:-ghcr.io/atishoo/capylink-server:ultrapro}
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - capylink-net
    restart: unless-stopped
