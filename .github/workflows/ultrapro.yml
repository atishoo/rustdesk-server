name: UltraPro server

on:
  push:
    branches:
      - ultrapro
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-server

jobs:
  build-server:
    name: Build hbbs and hbbr
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          profile: minimal
          override: true

      - name: Build server binaries
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --locked --release --all-features --target=x86_64-unknown-linux-musl

      - name: Prepare image binaries
        run: |
          install -m 0755 target/x86_64-unknown-linux-musl/release/hbbs docker/rootfs/usr/bin/hbbs
          install -m 0755 target/x86_64-unknown-linux-musl/release/hbbr docker/rootfs/usr/bin/hbbr
          install -m 0755 target/x86_64-unknown-linux-musl/release/rustdesk-utils docker/rootfs/usr/bin/rustdesk-utils

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: ultrapro-server-binaries
          path: docker/rootfs/usr/bin
          if-no-files-found: error

  publish-container:
    name: Publish amd64 container
    needs: build-server
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          name: ultrapro-server-binaries
          path: docker/rootfs/usr/bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: S6_ARCH=x86_64
          tags: |
            ${{ env.SERVER_IMAGE }}:ultrapro
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
