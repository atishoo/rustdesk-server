name: UltraPro server release

on:
  push:
    branches:
      - ultrapro
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/capylink-server

jobs:
  build-linux:
    name: Linux ${{ matrix.job.name }} binaries
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, target: x86_64-unknown-linux-musl, s6: x86_64 }
          - { name: arm64v8, target: aarch64-unknown-linux-musl, s6: aarch64 }
          - { name: armv7, target: armv7-unknown-linux-musleabihf, s6: armhf }
          - { name: i386, target: i686-unknown-linux-musl, s6: i686 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.job.target }}

      - name: Build Linux server
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --locked --release --all-features --target=${{ matrix.job.target }}

      - name: Make binaries executable
        run: chmod 0755 target/${{ matrix.job.target }}/release/hbbs target/${{ matrix.job.target }}/release/hbbr target/${{ matrix.job.target }}/release/capylink-utils

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: ultrapro-server-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/capylink-utils
          if-no-files-found: error

  build-windows:
    name: Windows x86_64 binaries
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: x86_64-pc-windows-msvc

      - name: Build Windows server
        uses: actions-rs/cargo@v1
        with:
          use-cross: false
          command: build
          args: --locked --release --all-features --target=x86_64-pc-windows-msvc

      - name: Package Windows server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/hbbs.exe dist/hbbs.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/hbbr.exe dist/hbbr.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/capylink-utils.exe dist/capylink-utils.exe
          Compress-Archive -Path dist/* -DestinationPath capylink-server-windows-x86_64-unsigned.zip -Force

      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: capylink-server-windows-x86_64-unsigned
          path: capylink-server-windows-x86_64-unsigned.zip
          if-no-files-found: error

  package-linux:
    name: Package Linux ${{ matrix.job.name }}
    needs: build-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, arch: amd64 }
          - { name: arm64v8, arch: arm64 }
          - { name: armv7, arch: armhf }
          - { name: i386, arch: i386 }
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: ultrapro-server-linux-${{ matrix.job.name }}
          path: dist

      - name: Package Linux server
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          chmod 0755 dist/*
          zip -j capylink-server-linux-${{ matrix.job.name }}.zip dist/*

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: capylink-server-linux-${{ matrix.job.name }}
          path: capylink-server-linux-${{ matrix.job.name }}.zip
          if-no-files-found: error

  package-debian:
    name: Debian package ${{ matrix.job.name }}
    needs: build-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, debian_platform: amd64, crossbuild_package: '' }
          - { name: arm64v8, debian_platform: arm64, crossbuild_package: crossbuild-essential-arm64 }
          - { name: armv7, debian_platform: armhf, crossbuild_package: crossbuild-essential-armhf }
          - { name: i386, debian_platform: i386, crossbuild_package: crossbuild-essential-i386 }
    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create packaging environment
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p debian-build/${{ matrix.job.name }}/bin

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: ultrapro-server-linux-${{ matrix.job.name }}
          path: debian-build/${{ matrix.job.name }}/bin

      - name: Build Debian packages
        run: |
          chmod 0755 debian-build/${{ matrix.job.name }}/bin/*
          cp -R debian systemd debian-build/${{ matrix.job.name }}/
          sed 's/{{ ARCH }}/${{ matrix.job.debian_platform }}/' debian/control.tpl > debian-build/${{ matrix.job.name }}/debian/control
          cd debian-build/${{ matrix.job.name }}
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform }}

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: capylink-server-deb-${{ matrix.job.name }}
          path: |
            debian-build/capylink-server-hbbr_*_${{ matrix.job.debian_platform }}.deb
            debian-build/capylink-server-hbbs_*_${{ matrix.job.debian_platform }}.deb
            debian-build/capylink-server-utils_*_${{ matrix.job.debian_platform }}.deb
          if-no-files-found: error

  build-container:
    name: Container ${{ matrix.job.name }}
    needs: build-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: amd64, platform: linux/amd64, s6: x86_64 }
          - { name: arm64v8, platform: linux/arm64, s6: aarch64 }
          - { name: armv7, platform: linux/arm/v7, s6: armhf }
          - { name: i386, platform: linux/386, s6: i686 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: ultrapro-server-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      - name: Make binaries executable
        run: chmod 0755 docker/rootfs/usr/bin/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.ultrapro
          platforms: ${{ matrix.job.platform }}
          push: true
          provenance: false
          build-args: S6_ARCH=${{ matrix.job.s6 }}
          tags: |
            ${{ env.SERVER_IMAGE }}:ultrapro-${{ matrix.job.name }}
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}-${{ matrix.job.name }}

  publish-container-manifest:
    name: Publish multi-architecture container
    needs: build-container
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ultrapro manifests
        run: |
          docker buildx imagetools create \
            --tag "${SERVER_IMAGE}:ultrapro" \
            "${SERVER_IMAGE}:ultrapro-amd64" \
            "${SERVER_IMAGE}:ultrapro-arm64v8" \
            "${SERVER_IMAGE}:ultrapro-armv7" \
            "${SERVER_IMAGE}:ultrapro-i386"
          docker buildx imagetools create \
            --tag "${SERVER_IMAGE}:${GITHUB_SHA}" \
            "${SERVER_IMAGE}:${GITHUB_SHA}-amd64" \
            "${SERVER_IMAGE}:${GITHUB_SHA}-arm64v8" \
            "${SERVER_IMAGE}:${GITHUB_SHA}-armv7" \
            "${SERVER_IMAGE}:${GITHUB_SHA}-i386"

  publish-release:
    name: Publish official server release artifacts
    needs:
      - build-windows
      - package-linux
      - package-debian
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: capylink-server-*
          path: release
          merge-multiple: true

      - name: Publish UltraPro release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultrapro
          name: capylink UltraPro server
          prerelease: true
          files: release/*
